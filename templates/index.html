<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 20px; }
        textarea { width: 100%; height: 200px; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #summary-output { margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 100px; }
    </style>
</head>
<body>
    <h1>AI Text Summarizer</h1>
    <p>Paste your text below and click "Summarize" to get a concise summary.</p>
    <textarea id="text-input" placeholder="Enter text to summarize..."></textarea>
    <button onclick="summarizeText()">Summarize</button>
    
    <h2>Summary:</h2>
    <div id="summary-output"></div>

    <script>
        async function summarizeText() {
            const inputText = document.getElementById('text-input').value;
            const summaryOutput = document.getElementById('summary-output');
            summaryOutput.innerHTML = 'Summarizing...';

            try {
                const response = await fetch('/predict_web', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: inputText })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                summaryOutput.innerHTML = data.summary;
            } catch (error) {
                summaryOutput.innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
